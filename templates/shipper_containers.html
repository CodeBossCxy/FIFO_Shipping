<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>Containers for Shipper {{ shipper_number|upper }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <link rel="stylesheet" href="/static/shipper_containers.css">
    <link rel="icon" href="/static/assets/favicon.ico" type="image/x-icon">
</head>
<body>
    <div class="container-fluid">
        <img src="{{ url_for('static', path='assets/Vintech_Logo.jpg')}}" class="logo-fixed" alt="Vintech Logo"/>
        <div class="header">
            <h1 id="shipper-number">{{ shipper_number|upper }}</h1>
            <div id="shipper-number-form">
                <input id="scanner-input" type="text" placeholder="Scan the Serial No to load containers" />
                <div id="popup" style="display:none; position:fixed; top:20px; left:50%; transform:translateX(-50%); background:#000; color:#fff; padding:10px; border-radius:5px;"></div>
            </div>
        </div>
        <div id="shipper-table-container"></div>
    </div>

    <!-- Admin Mode Button -->
    <button id="admin-btn">Admin</button>

    <!-- Admin Passcode Modal -->
    <div id="admin-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); justify-content:center; align-items:center; z-index:1000;">
        <div style="background:#fff; padding:30px; border-radius:10px; text-align:center; min-width:300px;">
            <h3 id="admin-modal-title">Enter Admin Passcode</h3>
            <input id="admin-passcode" type="password" placeholder="Passcode" style="width:100%; padding:10px; margin:15px 0; font-size:16px; border:1px solid #ccc; border-radius:5px;" />
            <div style="display:flex; gap:10px; justify-content:center;">
                <button onclick="verifyPasscode()" style="padding:10px 25px; background:#007bff; color:#fff; border:none; border-radius:5px; cursor:pointer;">Submit</button>
                <button onclick="document.getElementById('admin-modal').style.display='none'; document.getElementById('admin-passcode').value='';" style="padding:10px 25px; background:#6c757d; color:#fff; border:none; border-radius:5px; cursor:pointer;">Cancel</button>
            </div>
            <p id="admin-error" style="color:red; margin-top:10px; display:none;">Incorrect passcode</p>
        </div>
    </div>
    <audio id="success-sound" src="/static/assets/success.mp3" preload="auto"></audio>
    <audio id="error-sound" src="/static/assets/error.mp3" preload="auto"></audio>
    <script src="/static/shipper_containers.js"></script>
</body>
